<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Scope Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-gray-50">

  <div id="nav"></div>

  <div class="max-w-7xl mx-auto p-6">
    <div class="mb-6 flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Scope Manager</h1>
        <p class="text-gray-500 text-sm mt-1" id="subtitle"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="addScopeItem()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
          + Werkpakket
        </button>
        <button onclick="view='list'; render()" id="btn-list" class="px-3 py-2 border rounded-lg text-sm">Lijst</button>
        <button onclick="view='grid'; render()" id="btn-grid" class="px-3 py-2 border rounded-lg text-sm">Grid</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl border shadow-sm p-4 mb-4 flex gap-3 flex-wrap">
      <select id="filterStatus" onchange="render()" class="px-3 py-2 border rounded-lg text-sm">
        <option value="all">Alle statussen</option>
        <option value="In Scope">In Scope</option>
        <option value="Op Hold">Op Hold</option>
        <option value="Uit Scope">Uit Scope</option>
      </select>
      <select id="filterDiscipline" onchange="render()" class="px-3 py-2 border rounded-lg text-sm">
        <option value="all">Alle disciplines</option>
      </select>
      <input type="text" id="searchBox" placeholder="Zoeken..." onkeyup="render()"
        class="px-3 py-2 border rounded-lg text-sm flex-1 min-w-0">
    </div>

    <!-- Content -->
    <div id="content"></div>
  </div>

  <!-- ACTIVITEITEN MODAL -->
  <div id="activitiesModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-screen overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-xl font-bold" id="activitiesTitle">Activiteiten</h2>
          <button onclick="closeActivitiesModal()" class="p-2 hover:bg-gray-100 rounded-lg font-bold text-xl leading-none">&times;</button>
        </div>
        <p class="text-sm text-gray-500 mb-5" id="activitiesSubtitle"></p>

        <!-- Add form -->
        <div class="bg-blue-50 rounded-xl p-4 mb-5 border border-blue-100">
          <h3 class="font-semibold text-blue-800 mb-3 text-sm">Nieuwe activiteit toevoegen</h3>
          <div class="space-y-3">
            <input type="text" id="newActDesc" placeholder="Omschrijving activiteit *"
              class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
            <div class="grid grid-cols-2 gap-3">
              <select id="newActType" class="px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="Isolatie">Isolatie</option>
                <option value="Steiger">Steiger</option>
                <option value="Reiniging">Reiniging</option>
                <option value="Inspectie">Inspectie</option>
                <option value="Montage">Montage</option>
                <option value="Demontage">Demontage</option>
                <option value="Meting">Meting</option>
                <option value="Overig">Overig</option>
              </select>
              <input type="number" id="newActHours" placeholder="Geplande uren"
                class="px-3 py-2 border rounded-lg text-sm bg-white" min="0" step="0.5">
            </div>
            <input type="text" id="newActRef" placeholder="Referentie / werkopdracht (optioneel)"
              class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
          </div>
          <button onclick="addActivity()"
            class="mt-3 px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
            + Activiteit toevoegen
          </button>
        </div>

        <!-- List -->
        <div id="activitiesList"></div>

        <div class="mt-5 flex justify-end">
          <button onclick="closeActivitiesModal()"
            class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">
            Sluiten
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- WERKPAKKET MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-screen overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold" id="modalTitle">Werkpakket Bewerken</h2>
          <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg font-bold text-xl leading-none">&times;</button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Tag Nummer *</label>
            <input type="text" id="editTag" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Omschrijving *</label>
            <input type="text" id="editDesc" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
              <select id="editStatus" class="w-full px-3 py-2 border rounded-lg">
                <option value="In Scope">In Scope</option>
                <option value="Op Hold">Op Hold</option>
                <option value="Uit Scope">Uit Scope</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Prioriteit</label>
              <select id="editPriority" class="w-full px-3 py-2 border rounded-lg">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Discipline</label>
            <select id="editDiscipline" class="w-full px-3 py-2 border rounded-lg">
              <option value="Mechanical">Mechanical</option>
              <option value="Piping">Piping</option>
              <option value="Electrical">Electrical</option>
              <option value="Instrumentation">Instrumentation</option>
              <option value="Civil">Civil</option>
              <option value="Insulation">Insulation</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Systeem</label>
            <input type="text" id="editSystem" class="w-full px-3 py-2 border rounded-lg">
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">Annuleren</button>
          <button onclick="saveEdit()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Opslaan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var scopeItems = [];
    var view = 'list';
    var editingItem = null;
    var project = null;
    var activeItemId = null;

    function init() {
      project = ChemPrepDB.getActiveProject();
      if (!project) { window.location.href = 'index.html'; return; }
      document.getElementById('nav').innerHTML = ChemPrepNav.renderMenu('scope');
      loadData();
      populateFilters();
      render();
    }

    function loadData() {
      scopeItems = ChemPrepDB.getProjectScopeItems(project.id);
      document.getElementById('subtitle').textContent = scopeItems.length + ' werkpakketten';
    }

    function populateFilters() {
      var seen = {};
      var disciplines = [];
      scopeItems.forEach(function(i) {
        if (i.discipline && !seen[i.discipline]) { seen[i.discipline] = true; disciplines.push(i.discipline); }
      });
      var el = document.getElementById('filterDiscipline');
      el.innerHTML = '<option value="all">Alle disciplines</option>' +
        disciplines.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
    }

    function getFiltered() {
      var sf = document.getElementById('filterStatus').value;
      var df = document.getElementById('filterDiscipline').value;
      var s = document.getElementById('searchBox').value.toLowerCase();
      return scopeItems.filter(function(item) {
        if (sf !== 'all' && item.status !== sf) return false;
        if (df !== 'all' && item.discipline !== df) return false;
        if (s && item.tagNumber.toLowerCase().indexOf(s) === -1 && item.description.toLowerCase().indexOf(s) === -1) return false;
        return true;
      });
    }

    function render() {
      var filtered = getFiltered();
      var content = document.getElementById('content');

      ['list','grid'].forEach(function(v) {
        var btn = document.getElementById('btn-' + v);
        btn.className = 'px-3 py-2 border rounded-lg text-sm ' +
          (view === v ? 'bg-blue-600 text-white border-blue-600' : 'hover:bg-gray-50');
      });

      if (filtered.length === 0) {
        content.innerHTML =
          '<div class="bg-white rounded-xl p-12 text-center border">' +
          '<h3 class="text-xl font-bold text-gray-700 mb-2">Geen werkpakketten</h3>' +
          '<p class="text-gray-500 mb-4">Voeg je eerste werkpakket toe om te starten</p>' +
          '<button onclick="addScopeItem()" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium">+ Werkpakket Toevoegen</button>' +
          '</div>';
        return;
      }

      var scColors = {
        'In Scope': 'bg-blue-100 text-blue-700',
        'Op Hold': 'bg-amber-100 text-amber-700',
        'Uit Scope': 'bg-gray-100 text-gray-700'
      };

      if (view === 'list') {
        var rows = filtered.map(function(item) {
          var acts = item.plannedActivities || [];
          var done = acts.filter(function(a) { return a.executionStatus === 'Completed'; }).length;
          var pct = acts.length > 0 ? Math.round((done / acts.length) * 100) : 0;
          var sc = scColors[item.status] || scColors['In Scope'];
          return '<tr class="hover:bg-gray-50">' +
            '<td class="px-4 py-3"><span class="font-mono font-bold text-blue-600">' + esc(item.tagNumber) + '</span></td>' +
            '<td class="px-4 py-3 font-medium text-gray-800">' + esc(item.description) + '</td>' +
            '<td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold ' + sc + '">' + esc(item.status || 'In Scope') + '</span></td>' +
            '<td class="px-4 py-3 text-gray-600">' + esc(item.discipline || '') + '</td>' +
            '<td class="px-4 py-3 text-center text-gray-600">' + acts.length + '</td>' +
            '<td class="px-4 py-3">' +
              '<div class="flex items-center gap-2">' +
                '<div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">' +
                  '<div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:' + pct + '%"></div>' +
                '</div>' +
                '<span class="text-xs font-semibold text-gray-600 w-10 text-right">' + pct + '%</span>' +
              '</div>' +
            '</td>' +
            '<td class="px-4 py-3 text-right whitespace-nowrap">' +
              '<button onclick="openActivities(\'' + item.id + '\')" ' +
                'class="px-2 py-1 text-xs bg-green-100 text-green-700 rounded-lg hover:bg-green-200 font-semibold mr-1">' +
                'Activiteiten (' + acts.length + ')</button>' +
              '<button onclick="editItem(\'' + item.id + '\')" ' +
                'class="px-2 py-1 text-xs bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 mr-1">Bewerk</button>' +
              '<button onclick="deleteItem(\'' + item.id + '\')" ' +
                'class="px-2 py-1 text-xs bg-red-50 text-red-700 rounded-lg hover:bg-red-100">Wis</button>' +
            '</td>' +
          '</tr>';
        }).join('');

        content.innerHTML =
          '<div class="bg-white rounded-xl border shadow-sm overflow-hidden">' +
          '<div class="overflow-x-auto">' +
          '<table class="w-full text-sm">' +
            '<thead class="bg-gray-50 border-b"><tr>' +
              '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Tag</th>' +
              '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Omschrijving</th>' +
              '<th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>' +
              '<th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Discipline</th>' +
              '<th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Activiteiten</th>' +
              '<th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Voortgang</th>' +
              '<th class="px-4 py-3"></th>' +
            '</tr></thead>' +
            '<tbody class="divide-y">' + rows + '</tbody>' +
          '</table></div></div>';

      } else {
        var cards = filtered.map(function(item) {
          var acts = item.plannedActivities || [];
          var done = acts.filter(function(a) { return a.executionStatus === 'Completed'; }).length;
          var pct = acts.length > 0 ? Math.round((done / acts.length) * 100) : 0;
          var sc = scColors[item.status] || scColors['In Scope'];
          return '<div class="bg-white rounded-xl border shadow-sm overflow-hidden hover:shadow-lg transition">' +
            '<div class="h-2 bg-gradient-to-r from-blue-500 to-purple-500"></div>' +
            '<div class="p-5">' +
              '<div class="flex items-start justify-between mb-3">' +
                '<div class="font-mono font-bold text-lg text-blue-600">' + esc(item.tagNumber) + '</div>' +
                '<span class="px-2 py-1 rounded-full text-xs font-bold ' + sc + '">' + esc(item.status || 'In Scope') + '</span>' +
              '</div>' +
              '<p class="text-sm text-gray-700 mb-4">' + esc(item.description) + '</p>' +
              '<div class="text-xs text-gray-500 mb-3">' +
                (item.discipline ? '<div>' + esc(item.discipline) + '</div>' : '') +
                '<div>' + acts.length + ' activiteiten</div>' +
              '</div>' +
              '<div class="h-2 bg-gray-100 rounded-full overflow-hidden mb-1">' +
                '<div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:' + pct + '%"></div>' +
              '</div>' +
              '<div class="text-xs text-gray-500 mb-4">' + pct + '% gereed</div>' +
              '<div class="flex gap-2">' +
                '<button onclick="openActivities(\'' + item.id + '\')" class="flex-1 px-3 py-2 text-xs bg-green-50 text-green-700 rounded-lg hover:bg-green-100 font-semibold">' +
                  'Activiteiten (' + acts.length + ')</button>' +
                '<button onclick="editItem(\'' + item.id + '\')" class="px-3 py-2 text-xs bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100">Bewerk</button>' +
                '<button onclick="deleteItem(\'' + item.id + '\')" class="px-3 py-2 text-xs bg-red-50 text-red-700 rounded-lg hover:bg-red-100">Wis</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        content.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">' + cards + '</div>';
      }
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Werkpakket CRUD
    function addScopeItem() {
      editingItem = null;
      document.getElementById('modalTitle').textContent = 'Nieuw Werkpakket';
      document.getElementById('editTag').value = '';
      document.getElementById('editDesc').value = '';
      document.getElementById('editStatus').value = 'In Scope';
      document.getElementById('editPriority').value = 'Medium';
      document.getElementById('editDiscipline').value = 'Mechanical';
      document.getElementById('editSystem').value = '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function editItem(id) {
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === id) { item = scopeItems[i]; break; } }
      if (!item) return;
      editingItem = item;
      document.getElementById('modalTitle').textContent = 'Werkpakket Bewerken';
      document.getElementById('editTag').value = item.tagNumber || '';
      document.getElementById('editDesc').value = item.description || '';
      document.getElementById('editStatus').value = item.status || 'In Scope';
      document.getElementById('editPriority').value = item.priority || 'Medium';
      document.getElementById('editDiscipline').value = item.discipline || 'Mechanical';
      document.getElementById('editSystem').value = item.system || '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveEdit() {
      var tag = document.getElementById('editTag').value.trim();
      var desc = document.getElementById('editDesc').value.trim();
      if (!tag || !desc) { alert('Tag en omschrijving zijn verplicht'); return; }
      if (editingItem) {
        editingItem.tagNumber = tag;
        editingItem.description = desc;
        editingItem.status = document.getElementById('editStatus').value;
        editingItem.priority = document.getElementById('editPriority').value;
        editingItem.discipline = document.getElementById('editDiscipline').value;
        editingItem.system = document.getElementById('editSystem').value;
      } else {
        scopeItems.push({
          id: 'scope-' + Date.now(),
          projectId: project.id,
          tagNumber: tag,
          description: desc,
          status: document.getElementById('editStatus').value,
          priority: document.getElementById('editPriority').value,
          discipline: document.getElementById('editDiscipline').value,
          system: document.getElementById('editSystem').value,
          plannedActivities: [],
          created: new Date().toISOString()
        });
      }
      saveData();
      closeModal();
      loadData();
      populateFilters();
      render();
    }

    function deleteItem(id) {
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === id) { item = scopeItems[i]; break; } }
      if (!item) return;
      if (!confirm('Werkpakket "' + item.tagNumber + '" verwijderen? Alle bijbehorende activiteiten worden ook verwijderd.')) return;
      var newList = [];
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id !== id) newList.push(scopeItems[i]); }
      scopeItems = newList;
      saveData();
      loadData();
      render();
    }

    function saveData() {
      var all = ChemPrepDB.getScopeItems();
      var other = [];
      for (var i = 0; i < all.length; i++) { if (all[i].projectId !== project.id) other.push(all[i]); }
      ChemPrepDB.saveScopeItems(other.concat(scopeItems));
    }

    // Activiteiten
    function openActivities(id) {
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === id) { item = scopeItems[i]; break; } }
      if (!item) return;
      activeItemId = id;
      document.getElementById('activitiesTitle').textContent = 'Activiteiten - ' + item.tagNumber;
      document.getElementById('activitiesSubtitle').textContent = item.description;
      document.getElementById('newActDesc').value = '';
      document.getElementById('newActHours').value = '';
      document.getElementById('newActRef').value = '';
      document.getElementById('newActType').value = 'Isolatie';
      renderActivities(item);
      document.getElementById('activitiesModal').classList.remove('hidden');
    }

    function closeActivitiesModal() {
      document.getElementById('activitiesModal').classList.add('hidden');
      activeItemId = null;
    }

    function renderActivities(item) {
      var acts = item.plannedActivities || [];
      var el = document.getElementById('activitiesList');
      if (acts.length === 0) {
        el.innerHTML =
          '<div class="text-center py-10 text-gray-400 border-2 border-dashed rounded-xl">' +
          '<p class="text-sm">Nog geen activiteiten. Voeg er een toe via het formulier hierboven.</p>' +
          '</div>';
        return;
      }
      var statusColors = {
        'Niet gestart': 'bg-gray-100 text-gray-600',
        'In uitvoering': 'bg-blue-100 text-blue-700',
        'Completed': 'bg-emerald-100 text-emerald-700',
        'Op Hold': 'bg-amber-100 text-amber-700'
      };
      var statusOpts = ['Niet gestart','In uitvoering','Completed','Op Hold'];
      var html = '<p class="text-sm font-semibold text-gray-600 mb-3">' + acts.length + ' activiteit' + (acts.length !== 1 ? 'en' : '') + '</p>';
      html += '<div class="space-y-2">';
      for (var i = 0; i < acts.length; i++) {
        var a = acts[i];
        var idx = i;
        var curStatus = a.executionStatus || 'Niet gestart';
        var sc = statusColors[curStatus] || statusColors['Niet gestart'];
        var typeColor = 'bg-purple-100 text-purple-700';
        var opts = statusOpts.map(function(s) {
          return '<option value="' + s + '"' + (curStatus === s ? ' selected' : '') + '>' + s + '</option>';
        }).join('');
        html +=
          '<div class="border rounded-xl p-3 bg-white">' +
            '<div class="flex items-start gap-2">' +
              '<div class="flex-1 min-w-0">' +
                '<div class="flex flex-wrap items-center gap-2 mb-1">' +
                  '<span class="text-xs font-bold text-gray-400">#' + (idx + 1) + '</span>' +
                  '<span class="text-xs px-2 py-0.5 rounded-full ' + typeColor + ' font-medium">' + esc(a.type || 'Overig') + '</span>' +
                  '<span class="text-xs px-2 py-0.5 rounded-full ' + sc + ' font-medium">' + esc(curStatus) + '</span>' +
                  (a.plannedHours ? '<span class="text-xs text-gray-400">' + a.plannedHours + 'u</span>' : '') +
                '</div>' +
                '<p class="text-sm font-medium text-gray-800">' + esc(a.description) + '</p>' +
                (a.reference ? '<p class="text-xs text-gray-400 mt-0.5">Ref: ' + esc(a.reference) + '</p>' : '') +
              '</div>' +
              '<div class="flex gap-1 items-center flex-shrink-0">' +
                '<select onchange="updateActivityStatus(' + idx + ', this.value)" class="text-xs border rounded-lg px-1 py-1">' +
                  opts +
                '</select>' +
                '<button onclick="deleteActivity(' + idx + ')" ' +
                  'class="px-2 py-1 text-xs bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-medium ml-1">Wis</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
      html += '</div>';
      el.innerHTML = html;
    }

    function addActivity() {
      var desc = document.getElementById('newActDesc').value.trim();
      if (!desc) { alert('Omschrijving is verplicht'); return; }
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === activeItemId) { item = scopeItems[i]; break; } }
      if (!item) return;
      if (!item.plannedActivities) item.plannedActivities = [];
      var hrs = parseFloat(document.getElementById('newActHours').value);
      item.plannedActivities.push({
        id: 'act-' + Date.now(),
        description: desc,
        type: document.getElementById('newActType').value,
        plannedHours: isNaN(hrs) ? null : hrs,
        reference: document.getElementById('newActRef').value.trim(),
        executionStatus: 'Niet gestart',
        created: new Date().toISOString()
      });
      saveData();
      document.getElementById('newActDesc').value = '';
      document.getElementById('newActHours').value = '';
      document.getElementById('newActRef').value = '';
      renderActivities(item);
      render();
    }

    function updateActivityStatus(actIdx, newStatus) {
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === activeItemId) { item = scopeItems[i]; break; } }
      if (!item || !item.plannedActivities[actIdx]) return;
      item.plannedActivities[actIdx].executionStatus = newStatus;
      saveData();
      renderActivities(item);
      render();
    }

    function deleteActivity(actIdx) {
      var item = null;
      for (var i = 0; i < scopeItems.length; i++) { if (scopeItems[i].id === activeItemId) { item = scopeItems[i]; break; } }
      if (!item) return;
      var act = item.plannedActivities[actIdx];
      if (!confirm('Activiteit "' + act.description + '" verwijderen?')) return;
      item.plannedActivities.splice(actIdx, 1);
      saveData();
      renderActivities(item);
      render();
    }

    init();
  </script>
</body>
</html>
