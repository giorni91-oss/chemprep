<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Scope Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-gray-50">
  
  <div id="nav"></div>
  
  <div class="max-w-7xl mx-auto p-6">
    <div class="mb-6 flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">ðŸ“¦ Scope Manager</h1>
        <p class="text-gray-500 text-sm mt-1" id="subtitle"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="addScopeItem()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
          âž• Werkpakket
        </button>
        <button onclick="view='list'; render()" id="btn-list" class="px-3 py-2 border rounded-lg text-sm">ðŸ“‹ Lijst</button>
        <button onclick="view='grid'; render()" id="btn-grid" class="px-3 py-2 border rounded-lg text-sm">â–¦ Grid</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl border shadow-sm p-4 mb-4 flex gap-3 flex-wrap">
      <select id="filterStatus" onchange="render()" class="px-3 py-2 border rounded-lg text-sm">
        <option value="all">Alle statussen</option>
        <option value="In Scope">In Scope</option>
        <option value="Op Hold">Op Hold</option>
        <option value="Uit Scope">Uit Scope</option>
      </select>
      <select id="filterDiscipline" onchange="render()" class="px-3 py-2 border rounded-lg text-sm">
        <option value="all">Alle disciplines</option>
      </select>
      <input type="text" id="searchBox" placeholder="ðŸ” Zoeken..." onkeyup="render()" 
        class="px-3 py-2 border rounded-lg text-sm flex-1 min-w-0">
    </div>

    <!-- Content -->
    <div id="content"></div>
  </div>

  <!-- Activities Modal -->
  <div id="activitiesModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-xl font-bold" id="activitiesTitle">Activiteiten</h2>
          <button onclick="closeActivitiesModal()" class="p-2 hover:bg-gray-100 rounded-lg">✕</button>
        </div>
        <p class="text-sm text-gray-500 mb-4" id="activitiesSubtitle"></p>

        <!-- Add Activity Form -->
        <div class="bg-blue-50 rounded-xl p-4 mb-4 border border-blue-100">
          <h3 class="font-semibold text-blue-800 mb-3 text-sm">➕ Nieuwe Activiteit</h3>
          <div class="grid grid-cols-1 gap-3">
            <input type="text" id="newActDesc" placeholder="Omschrijving activiteit *"
              class="w-full px-3 py-2 border rounded-lg text-sm">
            <div class="grid grid-cols-2 gap-3">
              <select id="newActType" class="px-3 py-2 border rounded-lg text-sm">
                <option value="Isolatie">Isolatie</option>
                <option value="Steiger">Steiger</option>
                <option value="Reiniging">Reiniging</option>
                <option value="Inspectie">Inspectie</option>
                <option value="Montage">Montage</option>
                <option value="Demontage">Demontage</option>
                <option value="Meting">Meting</option>
                <option value="Overig">Overig</option>
              </select>
              <input type="number" id="newActHours" placeholder="Geplande uren"
                class="px-3 py-2 border rounded-lg text-sm" min="0" step="0.5">
            </div>
            <input type="text" id="newActRef" placeholder="Referentie / werkopdracht (optioneel)"
              class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <button onclick="addActivity()" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
            ➕ Toevoegen
          </button>
        </div>

        <!-- Activities List -->
        <div id="activitiesList"></div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold" id="modalTitle">Werkpakket Bewerken</h2>
          <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg">âœ•</button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Tag Nummer *</label>
            <input type="text" id="editTag" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Omschrijving *</label>
            <input type="text" id="editDesc" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
              <select id="editStatus" class="w-full px-3 py-2 border rounded-lg">
                <option value="In Scope">In Scope</option>
                <option value="Op Hold">Op Hold</option>
                <option value="Uit Scope">Uit Scope</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Prioriteit</label>
              <select id="editPriority" class="w-full px-3 py-2 border rounded-lg">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Discipline</label>
            <select id="editDiscipline" class="w-full px-3 py-2 border rounded-lg">
              <option value="Mechanical">Mechanical</option>
              <option value="Piping">Piping</option>
              <option value="Electrical">Electrical</option>
              <option value="Instrumentation">Instrumentation</option>
              <option value="Civil">Civil</option>
              <option value="Insulation">Insulation</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Systeem</label>
            <input type="text" id="editSystem" class="w-full px-3 py-2 border rounded-lg">
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">Annuleren</button>
          <button onclick="saveEdit()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Opslaan</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scopeItems = [];
    let view = 'list';
    let editingItem = null;
    let project = null;

    function init() {
      project = ChemPrepDB.getActiveProject();
      if (!project) { window.location.href = 'index.html'; return; }
      
      document.getElementById('nav').innerHTML = ChemPrepNav.renderMenu('scope');
      loadData();
      populateFilters();
      render();
    }

    function loadData() {
      scopeItems = ChemPrepDB.getProjectScopeItems(project.id);
      document.getElementById('subtitle').textContent = `${scopeItems.length} werkpakketten`;
    }

    function populateFilters() {
      const disciplines = new Set(scopeItems.map(i => i.discipline).filter(Boolean));
      const discFilter = document.getElementById('filterDiscipline');
      discFilter.innerHTML = '<option value="all">Alle disciplines</option>' +
        Array.from(disciplines).map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function getFiltered() {
      const statusFilter = document.getElementById('filterStatus').value;
      const discFilter = document.getElementById('filterDiscipline').value;
      const search = document.getElementById('searchBox').value.toLowerCase();
      
      return scopeItems.filter(item => {
        if (statusFilter !== 'all' && item.status !== statusFilter) return false;
        if (discFilter !== 'all' && item.discipline !== discFilter) return false;
        if (search && !item.tagNumber.toLowerCase().includes(search) && 
            !item.description.toLowerCase().includes(search)) return false;
        return true;
      });
    }

    function render() {
      const filtered = getFiltered();
      const content = document.getElementById('content');
      
      // Update view buttons
      ['list', 'grid'].forEach(v => {
        document.getElementById(`btn-${v}`).className = 
          `px-3 py-2 border rounded-lg text-sm ${view === v ? 'bg-blue-600 text-white border-blue-600' : 'hover:bg-gray-50'}`;
      });

      if (filtered.length === 0) {
        content.innerHTML = `
          <div class="bg-white rounded-xl p-12 text-center border">
            <div class="text-6xl mb-4">ðŸ“¦</div>
            <h3 class="text-xl font-bold text-gray-700 mb-2">Geen werkpakketten</h3>
            <p class="text-gray-500 mb-4">Voeg je eerste werkpakket toe</p>
            <button onclick="addScopeItem()" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium">
              âž• Werkpakket Toevoegen
            </button>
          </div>
        `;
        return;
      }

      if (view === 'list') {
        content.innerHTML = `
          <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b">
                <tr>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Tag</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Omschrijving</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Discipline</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Activiteiten</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Voortgang</th>
                  <th class="px-4 py-3 w-16"></th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${filtered.map(item => {
                  const acts = item.plannedActivities || [];
                  const done = acts.filter(a => a.executionStatus === 'Completed').length;
                  const pct = acts.length > 0 ? Math.round((done / acts.length) * 100) : 0;
                  const statusColors = {
                    'In Scope': 'bg-blue-100 text-blue-700',
                    'Op Hold': 'bg-amber-100 text-amber-700',
                    'Uit Scope': 'bg-gray-100 text-gray-700'
                  };
                  return `
                    <tr class="hover:bg-gray-50">
                      <td class="px-4 py-3">
                        <span class="font-mono font-bold text-blue-600">${item.tagNumber}</span>
                      </td>
                      <td class="px-4 py-3 font-medium text-gray-800">${item.description}</td>
                      <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded-full text-xs font-bold ${statusColors[item.status] || statusColors['In Scope']}">${item.status || 'In Scope'}</span>
                      </td>
                      <td class="px-4 py-3 text-gray-600">${item.discipline || 'â€”'}</td>
                      <td class="px-4 py-3 text-center text-gray-600">${acts.length}</td>
                      <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                          <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:${pct}%"></div>
                          </div>
                          <span class="text-xs font-semibold text-gray-600 w-10 text-right">${pct}%</span>
                        </div>
                      </td>
                      <td class="px-4 py-3 text-right whitespace-nowrap">
                        <button onclick="openActivities('${item.id}')" class="p-1.5 hover:bg-green-50 rounded text-green-700 text-xs font-semibold" title="Activiteiten beheren">📋 ${acts.length}</button>
                        <button onclick="editItem('${item.id}')" class="p-1.5 hover:bg-blue-50 rounded text-blue-600" title="Bewerken">✏️</button>
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 hover:bg-red-50 rounded text-red-600" title="Verwijderen">🗑️</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        content.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${filtered.map(item => {
              const acts = item.plannedActivities || [];
              const done = acts.filter(a => a.executionStatus === 'Completed').length;
              const pct = acts.length > 0 ? Math.round((done / acts.length) * 100) : 0;
              return `
                <div class="bg-white rounded-xl border shadow-sm overflow-hidden hover:shadow-lg transition">
                  <div class="h-2 bg-gradient-to-r from-blue-500 to-purple-500"></div>
                  <div class="p-5">
                    <div class="flex items-start justify-between mb-3">
                      <div class="font-mono font-bold text-lg text-blue-600">${item.tagNumber}</div>
                      <span class="px-2 py-1 rounded-full text-xs font-bold ${item.status === 'In Scope' ? 'bg-blue-100 text-blue-700' : item.status === 'Op Hold' ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-700'}">${item.status || 'In Scope'}</span>
                    </div>
                    <p class="text-sm text-gray-700 mb-4 line-clamp-2">${item.description}</p>
                    <div class="text-xs text-gray-500 mb-3">
                      ${item.discipline ? `<div>ðŸ“‹ ${item.discipline}</div>` : ''}
                      <div>ðŸ”§ ${acts.length} activiteiten</div>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden mb-2">
                      <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600" style="width:${pct}%"></div>
                    </div>
                    <div class="text-xs text-gray-500 mb-3">${pct}% gereed</div>
                    <div class="flex gap-2">
                      <button onclick="editItem('${iteclass="flex gap-2">
                      <button onclick="openActivities('${item.id}')" class="flex-1 px-3 py-2 text-xs bg-green-50 text-green-700 rounded hover:bg-green-100 font-medium">📋 ${acts.length} Activiteiten</button>
                      <button onclick="editItem('${item.id}')" class="px-3 py-2 text-xs bg-blue-50 text-blue-700 rounded hover:bg-blue-100" title="Bewerken">✏️</button>
                      <button onclick="deleteItem('${item.id}')" class="px-3 py-2 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100" title="Verwijderen">🗑️</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function addScopeItem() {
      editingItem = null;
      document.getElementById('modalTitle').textContent = 'Nieuw Werkpakket';
      document.getElementById('editTag').value = '';
      document.getElementById('editDesc').value = '';
      document.getElementById('editStatus').value = 'In Scope';
      document.getElementById('editPriority').value = 'Medium';
      document.getElementById('editDiscipline').value = 'Mechanical';
      document.getElementById('editSystem').value = '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function editItem(id) {
      const item = scopeItems.find(i => i.id === id);
      if (!item) return;
      
      editingItem = item;
      document.getElementById('modalTitle').textContent = 'Werkpakket Bewerken';
      document.getElementById('editTag').value = item.tagNumber || '';
      document.getElementById('editDesc').value = item.description || '';
      document.getElementById('editStatus').value = item.status || 'In Scope';
      document.getElementById('editPriority').value = item.priority || 'Medium';
      document.getElementById('editDiscipline').value = item.discipline || 'Mechanical';
      document.getElementById('editSystem').value = item.system || '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveEdit() {
      const tag = document.getElementById('editTag').value.trim();
      const desc = document.getElementById('editDesc').value.trim();
      
      if (!tag || !desc) {
        alert('Tag en omschrijving zijn verplicht');
        return;
      }

      if (editingItem) {
        // Update existing
        editingItem.tagNumber = tag;
        editingItem.description = desc;
        editingItem.status = document.getElementById('editStatus').value;
        editingItem.priority = document.getElementById('editPriority').value;
        editingItem.discipline = document.getElementById('editDiscipline').value;
        editingItem.system = document.getElementById('editSystem').value;
      } else {
        // Create new
        const newItem = {
          id: 'scope-' + Date.now(),
          projectId: project.id,
          tagNumber: tag,
          description: desc,
          status: document.getElementById('editStatus').value,
          priority: document.getElementById('editPriority').value,
          discipline: document.getElementById('editDiscipline').value,
          system: document.getElementById('editSystem').value,
          plannedActivities: [],
          created: new Date().toISOString()
        };
        scopeItems.push(newItem);
      }

      saveData();
      closeModal();
      loadData();
      populateFilters();
      render();
    }

    function deleteItem(id) {
      const item = scopeItems.find(i => i.id === id);
      if (!item) return;
      
      if (!confirm(`Werkpakket "${item.tagNumber}" verwijderen?`)) return;
      
      scopeItems = scopeItems.filter(i => i.id !== id);
      saveData();
      loadData();
      render();
    }

    function saveData() {
      const allScope = ChemPrepDB.getScopeItems().filter(i => i.projectId !== project.id);
      ChemPrepDB.saveScopeItems([...allScope, ...scopeItems]);
    }

    // ── Activiteiten beheer ──────────────────────────────────────────
    let activeItemId = null;

    function openActivities(id) {
      const item = scopeItems.find(i => i.id === id);
      if (!item) return;
      activeItemId = id;
      document.getElementById('activitiesTitle').textContent = `📋 Activiteiten – ${item.tagNumber}`;
      document.getElementById('activitiesSubtitle').textContent = item.description;
      // Reset form
      document.getElementById('newActDesc').value = '';
      document.getElementById('newActHours').value = '';
      document.getElementById('newActRef').value = '';
      document.getElementById('newActType').value = 'Isolatie';
      renderActivities(item);
      document.getElementById('activitiesModal').classList.remove('hidden');
    }

    function closeActivitiesModal() {
      document.getElementById('activitiesModal').classList.add('hidden');
      activeItemId = null;
    }

    function renderActivities(item) {
      const acts = item.plannedActivities || [];
      const list = document.getElementById('activitiesList');

      if (acts.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-gray-400">
          <div class="text-4xl mb-2">📝</div>
          <p class="text-sm">Nog geen activiteiten. Voeg er een toe hierboven.</p>
        </div>`;
        return;
      }

      const statusOptions = ['Niet gestart', 'In uitvoering', 'Completed', 'Op Hold'];
      const statusColors = {
        'Niet gestart': 'bg-gray-100 text-gray-600',
        'In uitvoering': 'bg-blue-100 text-blue-700',
        'Completed': 'bg-emerald-100 text-emerald-700',
        'Op Hold': 'bg-amber-100 text-amber-700'
      };

      list.innerHTML = `
        <h3 class="font-semibold text-gray-700 mb-3 text-sm">${acts.length} Activiteit${acts.length !== 1 ? 'en' : ''}</h3>
        <div class="space-y-2">
          ${acts.map((a, idx) => `
            <div class="border rounded-xl p-3 bg-white hover:shadow-sm transition">
              <div class="flex items-start justify-between gap-2">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <span class="text-xs font-bold text-gray-400">#${idx + 1}</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 font-medium">${a.type || 'Overig'}</span>
                    <span class="text-xs px-2 py-0.5 rounded-full ${statusColors[a.executionStatus] || statusColors['Niet gestart']} font-medium">
                      ${a.executionStatus || 'Niet gestart'}
                    </span>
                    ${a.plannedHours ? `<span class="text-xs text-gray-400">⏱ ${a.plannedHours}u</span>` : ''}
                  </div>
                  <p class="text-sm font-medium text-gray-800">${a.description}</p>
                  ${a.reference ? `<p class="text-xs text-gray-400 mt-0.5">Ref: ${a.reference}</p>` : ''}
                </div>
                <div class="flex gap-1 flex-shrink-0">
                  <select onchange="updateActivityStatus('${idx}', this.value)"
                    class="text-xs border rounded px-1 py-1 text-gray-600 bg-white">
                    ${statusOptions.map(s => `<option value="${s}" ${(a.executionStatus || 'Niet gestart') === s ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                  <button onclick="deleteActivity('${idx}')" class="p-1 hover:bg-red-50 rounded text-red-500 text-xs" title="Verwijderen">🗑️</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function addActivity() {
      const desc = document.getElementById('newActDesc').value.trim();
      if (!desc) { alert('Omschrijving is verplicht'); return; }

      const item = scopeItems.find(i => i.id === activeItemId);
      if (!item) return;
      if (!item.plannedActivities) item.plannedActivities = [];

      item.plannedActivities.push({
        id: 'act-' + Date.now(),
        description: desc,
        type: document.getElementById('newActType').value,
        plannedHours: parseFloat(document.getElementById('newActHours').value) || null,
        reference: document.getElementById('newActRef').value.trim(),
        executionStatus: 'Niet gestart',
        created: new Date().toISOString()
      });

      saveData();
      // Reset form
      document.getElementById('newActDesc').value = '';
      document.getElementById('newActHours').value = '';
      document.getElementById('newActRef').value = '';
      renderActivities(item);
      render(); // update counts in main view
    }

    function updateActivityStatus(actIdx, newStatus) {
      const item = scopeItems.find(i => i.id === activeItemId);
      if (!item || !item.plannedActivities[actIdx]) return;
      item.plannedActivities[actIdx].executionStatus = newStatus;
      saveData();
      renderActivities(item);
      render();
    }

    function deleteActivity(actIdx) {
      const item = scopeItems.find(i => i.id === activeItemId);
      if (!item) return;
      const act = item.plannedActivities[actIdx];
      if (!confirm(`Activiteit "${act.description}" verwijderen?`)) return;
      item.plannedActivities.splice(actIdx, 1);
      saveData();
      renderActivities(item);
      render();
    }

    init();
  </script>
</body>
</html>
