<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Material Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-gray-50">
  
  <div id="nav"></div>
  
  <div class="max-w-7xl mx-auto p-6">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">📦 Material Management</h1>
        <p class="text-gray-500 text-sm mt-1" id="subtitle"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="view='overview'; render()" id="btn-overview" class="px-4 py-2 rounded-lg text-sm font-medium">Overzicht</button>
        <button onclick="view='catalog'; render()" id="btn-catalog" class="px-4 py-2 rounded-lg text-sm font-medium">Catalogus</button>
        <button onclick="view='orders'; render()" id="btn-orders" class="px-4 py-2 rounded-lg text-sm font-medium">Bestellingen</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-6 gap-3 mb-6" id="stats"></div>

    <!-- Content -->
    <div id="content"></div>
  </div>

  <script>
    const STATUSES = [
      { id: 'not_ordered', label: 'Niet besteld', color: 'text-slate-600', bg: 'bg-slate-100' },
      { id: 'ordered', label: 'Besteld', color: 'text-amber-700', bg: 'bg-amber-100' },
      { id: 'delivered', label: 'Geleverd', color: 'text-emerald-700', bg: 'bg-emerald-100' },
    ];

    let view = 'overview';
    let scopeItems = [];
    let materials = [];

    function init() {
      const project = ChemPrepDB.getActiveProject();
      if (!project) { window.location.href = 'index.html'; return; }
      
      document.getElementById('nav').innerHTML = ChemPrepNav.renderMenu('materials');
      scopeItems = ChemPrepDB.getProjectScopeItems(project.id);
      materials = ChemPrepDB.getMaterials();
      render();
    }

    function getAllAssignments() {
      const list = [];
      scopeItems.forEach(item => {
        (item.plannedActivities || []).forEach(act => {
          (act.materials || []).forEach(ma => {
            const mat = materials.find(m => m.id === ma.materialId);
            if (!mat) return;
            list.push({
              ...ma,
              matDesc: mat.description,
              matUnit: mat.unit || 'st',
              matPrice: mat.price || 0,
              itemTag: item.tagNumber,
              actId: act.activityId,
              itemId: item.id,
              status: ma.status || 'not_ordered',
              orderRef: ma.orderRef || '',
              expectedDate: ma.expectedDate || ''
            });
          });
        });
      });
      return list;
    }

    function render() {
      const assignments = getAllAssignments();
      const stats = {};
      STATUSES.forEach(s => { stats[s.id] = assignments.filter(a => a.status === s.id).length; });
      stats.total = assignments.length;

      // Subtitle
      document.getElementById('subtitle').textContent = 
        `${assignments.length} materiaalregels · ${materials.length} artikelen in catalogus`;

      // Stats cards
      document.getElementById('stats').innerHTML = [
        { label: 'Totaal', value: stats.total, bg: 'bg-slate-50' },
        ...STATUSES.map(s => ({ label: s.label, value: stats[s.id], bg: s.bg }))
      ].map(k => `
        <div class="${k.bg} rounded-xl p-3 border border-gray-200">
          <p class="text-xs text-gray-500">${k.label}</p>
          <p class="text-2xl font-bold text-gray-800">${k.value}</p>
        </div>
      `).join('');

      // View buttons
      ['overview', 'catalog', 'orders'].forEach(v => {
        document.getElementById(`btn-${v}`).className = 
          `px-4 py-2 rounded-lg text-sm font-medium ${view === v ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'}`;
      });

      // Content
      const content = document.getElementById('content');
      
      if (view === 'overview') {
        content.innerHTML = `
          <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b">
                <tr>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Materiaal</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Scope</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Qty</th>
                  <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Waarde</th>
                  <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Bestelnr.</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${assignments.length === 0 ? `
                  <tr><td colspan="6" class="px-4 py-12 text-center text-gray-400">Geen materialen</td></tr>
                ` : assignments.map(a => {
                  const st = STATUSES.find(s => s.id === a.status) || STATUSES[0];
                  return `
                    <tr class="hover:bg-gray-50">
                      <td class="px-4 py-2.5">
                        <p class="font-medium text-gray-800 text-xs">${a.matDesc}</p>
                      </td>
                      <td class="px-4 py-2.5 font-mono text-xs font-bold text-blue-600">${a.itemTag}</td>
                      <td class="px-4 py-2.5 text-center text-xs">${a.quantity || 1} ${a.matUnit}</td>
                      <td class="px-4 py-2.5 text-right text-xs font-semibold text-emerald-700">€${(a.matPrice * (a.quantity || 1)).toFixed(0)}</td>
                      <td class="px-4 py-2.5 text-center">
                        <select onchange="updateStatus('${a.id}', '${a.itemId}', '${a.actId}', this.value)" 
                          class="px-2 py-1 rounded-full text-xs font-bold ${st.bg} ${st.color} border-0">
                          ${STATUSES.map(s => `<option value="${s.id}" ${a.status === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
                        </select>
                      </td>
                      <td class="px-4 py-2.5">
                        <input type="text" placeholder="PO-nr..." value="${a.orderRef}" 
                          onchange="updateOrderRef('${a.id}', '${a.itemId}', '${a.actId}', this.value)"
                          class="w-24 border border-gray-200 rounded px-2 py-0.5 text-xs">
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (view === 'catalog') {
        content.innerHTML = `
          <div class="bg-white rounded-xl border shadow-sm p-6">
            <div class="mb-4 flex gap-3">
              <button onclick="addMaterial()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">
                ➕ Artikel Toevoegen
              </button>
            </div>
            <div class="space-y-2">
              ${materials.length === 0 ? `
                <p class="text-center text-gray-400 py-8">Geen artikelen in catalogus</p>
              ` : materials.map(m => `
                <div class="p-3 bg-gray-50 rounded-lg flex items-center gap-4">
                  <div class="flex-1">
                    <div class="font-medium text-gray-800">${m.description}</div>
                    <div class="text-xs text-gray-500">${m.articleNumber || '—'} · ${m.supplier || '—'}</div>
                  </div>
                  <div class="text-right">
                    <div class="font-semibold text-emerald-700">€${(m.price || 0).toFixed(2)}</div>
                    <div class="text-xs text-gray-500">${m.unit || 'st'}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        const orders = assignments.filter(a => a.status === 'ordered');
        content.innerHTML = `
          <div class="space-y-4">
            ${orders.length === 0 ? `
              <div class="bg-green-50 border border-green-200 rounded-xl p-12 text-center">
                <p class="text-3xl mb-2">✅</p>
                <p class="font-bold text-green-800">Geen openstaande bestellingen</p>
              </div>
            ` : `
              <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                <div class="px-5 py-3 bg-gray-50 border-b font-bold">Openstaande Bestellingen</div>
                <table class="w-full text-xs">
                  <thead class="border-b">
                    <tr>
                      <th class="text-left px-4 py-2 font-semibold text-gray-500">Materiaal</th>
                      <th class="text-center px-4 py-2 font-semibold text-gray-500">Qty</th>
                      <th class="text-right px-4 py-2 font-semibold text-gray-500">Waarde</th>
                      <th class="text-left px-4 py-2 font-semibold text-gray-500">Bestelnr.</th>
                      <th class="text-left px-4 py-2 font-semibold text-gray-500">Scope</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${orders.map(a => `
                      <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 font-medium">${a.matDesc}</td>
                        <td class="px-4 py-2 text-center">${a.quantity || 1} ${a.matUnit}</td>
                        <td class="px-4 py-2 text-right font-semibold text-emerald-700">€${(a.matPrice * (a.quantity || 1)).toFixed(0)}</td>
                        <td class="px-4 py-2 font-mono">${a.orderRef || '—'}</td>
                        <td class="px-4 py-2 font-mono font-bold text-blue-600">${a.itemTag}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;
      }
    }

    function updateStatus(assignmentId, itemId, actId, newStatus) {
      scopeItems = scopeItems.map(item => {
        if (item.id !== itemId) return item;
        return {
          ...item,
          plannedActivities: (item.plannedActivities || []).map(act => {
            if (act.activityId !== actId) return act;
            return {
              ...act,
              materials: (act.materials || []).map(ma =>
                ma.id === assignmentId ? { ...ma, status: newStatus } : ma
              )
            };
          })
        };
      });
      ChemPrepDB.saveScopeItems([...ChemPrepDB.getScopeItems().filter(s => s.projectId !== scopeItems[0].projectId), ...scopeItems]);
      render();
    }

    function updateOrderRef(assignmentId, itemId, actId, newRef) {
      scopeItems = scopeItems.map(item => {
        if (item.id !== itemId) return item;
        return {
          ...item,
          plannedActivities: (item.plannedActivities || []).map(act => {
            if (act.activityId !== actId) return act;
            return {
              ...act,
              materials: (act.materials || []).map(ma =>
                ma.id === assignmentId ? { ...ma, orderRef: newRef } : ma
              )
            };
          })
        };
      });
      ChemPrepDB.saveScopeItems([...ChemPrepDB.getScopeItems().filter(s => s.projectId !== scopeItems[0].projectId), ...scopeItems]);
    }

    function addMaterial() {
      const desc = prompt('Omschrijving:');
      if (!desc) return;
      const price = prompt('Prijs per eenheid:');
      
      materials.push({
        id: 'mat-' + Date.now(),
        description: desc,
        price: parseFloat(price) || 0,
        unit: 'st',
        articleNumber: '',
        supplier: ''
      });
      ChemPrepDB.saveMaterials(materials);
      render();
    }

    init();
  </script>
</body>
</html>
