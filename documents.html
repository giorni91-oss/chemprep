<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Documenten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-gray-50">
  <div id="nav"></div>
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">📄 Document Management</h1>
      <button onclick="addDoc()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">➕ Document</button>
    </div>
    <div id="docs"></div>
  </div>
  <script>
    function init() {
      const project = ChemPrepDB.getActiveProject();
      if (!project) { window.location.href = 'index.html'; return; }
      document.getElementById('nav').innerHTML = ChemPrepNav.renderMenu('documents');
      const scopeItems = ChemPrepDB.getProjectScopeItems(project.id);
      const allDocs = [];
      scopeItems.forEach(item => {
        (item.documents || []).forEach(doc => {
          allDocs.push({ ...doc, itemTag: item.tagNumber, itemId: item.id });
        });
      });
      const cats = ChemPrepDB.getDocCategories();
      document.getElementById('docs').innerHTML = allDocs.length === 0 ? `
        <div class="bg-white rounded-xl p-12 text-center border">
          <p class="text-6xl mb-4">📄</p>
          <h3 class="text-xl font-bold text-gray-700 mb-2">Geen documenten</h3>
          <p class="text-gray-500">Koppel documenten aan werkpakketten</p>
        </div>
      ` : `
        <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Nr.</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Titel</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Type</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Scope</th>
                <th class="text-center px-4 py-3 text-xs font-semibold text-gray-500">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              ${allDocs.map(d => {
                const cat = cats.find(c => c.id === d.categoryId);
                const statusColors = { 'Approved':'bg-emerald-100 text-emerald-700', 'Draft':'bg-amber-100 text-amber-700', 'Concept':'bg-gray-100 text-gray-700' };
                return `
                  <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-mono text-blue-600">${d.docNumber || '—'}</td>
                    <td class="px-4 py-3 font-medium">${d.title || '—'}</td>
                    <td class="px-4 py-3 text-gray-600">${cat?.name || '—'}</td>
                    <td class="px-4 py-3 font-mono text-sm">${d.itemTag}</td>
                    <td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusColors[d.status] || 'bg-gray-100'}">${d.status || 'Concept'}</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    function addDoc() {
      alert('Ga naar Scope Manager om documenten aan werkpakketten toe te voegen');
    }
    init();
  </script>
</body>
</html>
