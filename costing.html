<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Kostenbeheer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-gray-50">
  <div id="nav"></div>
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">💰 Kostenbeheer</h1>
    <div class="grid grid-cols-4 gap-4 mb-6" id="totals"></div>
    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
      <table class="w-full text-sm" id="costTable"></table>
    </div>
  </div>
  <script>
    function init() {
      const project = ChemPrepDB.getActiveProject();
      if (!project) { window.location.href = 'index.html'; return; }
      document.getElementById('nav').innerHTML = ChemPrepNav.renderMenu('costing');
      const scopeItems = ChemPrepDB.getProjectScopeItems(project.id);
      
      let totalCost = 0, labor = 0, materials = 0, equipment = 0;
      const rows = [];
      
      scopeItems.forEach(item => {
        const itemCost = (item.costRules || []).reduce((s,r) => s + ((r.aantal||0) * (r.tarief||0)), 0);
        totalCost += itemCost;
        labor += itemCost * 0.6;
        materials += itemCost * 0.25;
        equipment += itemCost * 0.15;
        
        rows.push({ tag: item.tagNumber, desc: item.description, cost: itemCost });
      });
      
      document.getElementById('totals').innerHTML = [
        { label:'Totaal', value:`€${(totalCost/1000).toFixed(0)}k`, bg:'bg-slate-50' },
        { label:'Arbeid', value:`€${(labor/1000).toFixed(0)}k`, bg:'bg-blue-50' },
        { label:'Materiaal', value:`€${(materials/1000).toFixed(0)}k`, bg:'bg-emerald-50' },
        { label:'Equipment', value:`€${(equipment/1000).toFixed(0)}k`, bg:'bg-amber-50' }
      ].map(t => `
        <div class="${t.bg} rounded-xl p-4 border">
          <p class="text-xs text-gray-500 mb-1">${t.label}</p>
          <p class="text-2xl font-bold text-gray-800">${t.value}</p>
        </div>
      `).join('');
      
      document.getElementById('costTable').innerHTML = `
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Tag</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Omschrijving</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500">Kosten</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          ${rows.map(r => `
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-mono text-blue-600">${r.tag}</td>
              <td class="px-4 py-3 text-gray-700">${r.desc}</td>
              <td class="px-4 py-3 text-right font-semibold text-emerald-700">€${r.cost.toFixed(0)}</td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }
    init();
  </script>
</body>
</html>
