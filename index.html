<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ChemPrep v5.1 - Turnaround Management</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root { width: 100vw; height: 100vh; }
    
    /* Loading spinner */
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-direction: column;
      gap: 24px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">
      <div class="spinner"></div>
      <div class="loader-text">ChemPrep aan het laden...</div>
      <div style="color: rgba(255,255,255,0.7); font-size: 14px;">Dit kan 10-15 seconden duren</div>
    </div>
  </div>
  
  <script>
    // Global error handler
    window.addEventListener('error', function(e) {
      console.error('Error:', e.message);
      document.getElementById('root').innerHTML = `
        <div style="padding: 40px; font-family: sans-serif; max-width: 800px; margin: 0 auto;">
          <h1 style="color: #ef4444; margin-bottom: 16px;">⚠️ Laadprobleem</h1>
          <p style="color: #64748b; margin-bottom: 20px;">ChemPrep kon niet laden op dit apparaat.</p>
          <div style="background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
            <strong>Foutmelding:</strong><br/>
            <code style="color: #ef4444;">${e.message}</code>
          </div>
          <div style="background: #fef3c7; border: 1px solid #fbbf24; padding: 16px; border-radius: 8px;">
            <strong>💡 Tips:</strong>
            <ul style="margin: 8px 0 0 20px; color: #92400e;">
              <li>Probeer het op een laptop/desktop (mobiele browsers hebben vaak te weinig geheugen)</li>
              <li>Hard refresh: Ctrl+Shift+R (Windows) of Cmd+Shift+R (Mac)</li>
              <li>Probeer Chrome of Edge browser</li>
              <li>Schakel browser extensies tijdelijk uit</li>
            </ul>
          </div>
        </div>
      `;
    });
  </script>
  
  <script type="text/babel">
    (async () => {
      try {
        console.log('🚀 ChemPrep starting...');
        
        // Setup React & Icons
        const React = window.React;
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const icons = window.lucide.icons;
        
        // Map all icons
        const Activity=icons.Activity, AlertCircle=icons.AlertCircle, AlertTriangle=icons.AlertTriangle,
              Archive=icons.Archive, ArrowRight=icons.ArrowRight, BarChart2=icons.BarChart2,
              BarChart3=icons.BarChart3, Bell=icons.Bell, Book=icons.Book, Box=icons.Box,
              Building2=icons.Building2, Calculator=icons.Calculator, Calendar=icons.Calendar,
              Camera=icons.Camera, Check=icons.Check, CheckCircle=icons.CheckCircle,
              CheckCircle2=icons.CheckCircle2, ChevronDown=icons.ChevronDown, ChevronLeft=icons.ChevronLeft,
              ChevronRight=icons.ChevronRight, Circle=icons.Circle, Clock=icons.Clock,
              Database=icons.Database, DollarSign=icons.DollarSign, Download=icons.Download,
              Edit2=icons.Edit2, FileOutput=icons.FileOutput, FileSpreadsheet=icons.FileSpreadsheet,
              FileText=icons.FileText, Filter=icons.Filter, FolderOpen=icons.FolderOpen,
              GitBranch=icons.GitBranch, GripVertical=icons.GripVertical, History=icons.History,
              Layers=icons.Layers, LayoutDashboard=icons.LayoutDashboard, Link2=icons.Link2,
              Loader=icons.Loader, Menu=icons.Menu, Monitor=icons.Monitor, Package=icons.Package,
              Percent=icons.Percent, Play=icons.Play, Plus=icons.Plus, Printer=icons.Printer,
              QrCode=icons.QrCode, RefreshCw=icons.RefreshCw, Save=icons.Save, ScanLine=icons.ScanLine,
              Search=icons.Search, Settings=icons.Settings, Share2=icons.Share2, Square=icons.Square,
              Table=icons.Table, Tag=icons.Tag, Trash2=icons.Trash2, TrendingUp=icons.TrendingUp,
              Triangle=icons.Triangle, Upload=icons.Upload, User=icons.User, Users=icons.Users,
              Wrench=icons.Wrench, X=icons.X, Zap=icons.Zap;
        
        console.log('✅ Dependencies loaded');
        
        // Load ChemPrep code
        const response = await fetch('ChemPrep-v5.1.jsx');
        if (!response.ok) throw new Error('Could not load ChemPrep-v5.1.jsx');
        
        let code = await response.text();
        console.log(`✅ Loaded ${(code.length/1024).toFixed(0)}KB of code`);
        
        // Remove imports/exports
        code = code.replace(/^import.*from.*['"];?\s*$/gm, '');
        code = code.replace(/^export default App;?\s*$/m, '');
        
        // Execute code (this defines App component)
        eval(code);
        console.log('✅ App component ready');
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        console.log('✅ ChemPrep rendered successfully!');
        
      } catch(err) {
        console.error('❌ Fatal error:', err);
        document.getElementById('root').innerHTML = `
          <div style="padding: 40px; font-family: sans-serif; max-width: 800px; margin: 0 auto;">
            <h1 style="color: #ef4444;">⚠️ ChemPrep kon niet laden</h1>
            <p style="color: #64748b; margin: 20px 0;">Er is een fout opgetreden tijdens het laden.</p>
            <div style="background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px; overflow: auto;">
              <strong>Fout:</strong><br/>
              <code style="color: #ef4444;">${err.message}</code>
              <pre style="margin-top: 12px; font-size: 11px; color: #64748b;">${err.stack || ''}</pre>
            </div>
            <div style="background: #fef3c7; border: 1px solid #fbbf24; padding: 16px; border-radius: 8px;">
              <strong>💡 Controleer:</strong>
              <ul style="margin: 8px 0 0 20px; color: #92400e;">
                <li>Staat <code>ChemPrep-v5.1.jsx</code> in dezelfde map als <code>index.html</code>?</li>
                <li>Browser console (F12) voor meer details</li>
                <li>Gebruik je Chrome, Edge, Firefox of Safari? (IE werkt niet)</li>
              </ul>
            </div>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
