<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemPrep - Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen p-4">
  
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">📦 ChemPrep v5.1 - Modular</h1>
      <p class="text-gray-500">Turnaround Management System</p>
    </div>

    <!-- Actions -->
    <div class="bg-white rounded-xl shadow-lg p-4 mb-6 flex gap-3 flex-wrap">
      <button onclick="createProject()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
        ➕ Nieuw Project
      </button>
      <button onclick="importData()" class="px-4 py-2 bg-slate-600 text-white rounded-lg font-medium hover:bg-slate-700">
        📥 Importeer Backup
      </button>
      <button onclick="exportData()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700">
        📤 Exporteer Backup
      </button>
      <div class="flex-1"></div>
      <div class="text-sm text-gray-500 flex items-center gap-2">
        <span id="projectCount">0 projecten</span> · 
        <span id="scopeCount">0 werkpakketten</span>
      </div>
    </div>

    <!-- Projects Grid -->
    <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Filled by JavaScript -->
    </div>
  </div>

  <script>
    // Load and render projects
    function render() {
      const projects = ChemPrepDB.getProjects();
      const allScope = ChemPrepDB.getScopeItems();
      
      document.getElementById('projectCount').textContent = `${projects.length} project${projects.length !== 1 ? 'en' : ''}`;
      document.getElementById('scopeCount').textContent = `${allScope.length} werkpakket${allScope.length !== 1 ? 'ten' : ''}`;
      
      const grid = document.getElementById('projectsGrid');
      
      if (projects.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white rounded-xl p-12 text-center">
            <div class="text-6xl mb-4">📦</div>
            <h3 class="text-xl font-bold text-gray-700 mb-2">Geen projecten</h3>
            <p class="text-gray-500 mb-4">Maak je eerste turnaround project aan</p>
            <button onclick="createProject()" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
              ➕ Nieuw Project
            </button>
          </div>
        `;
        return;
      }
      
      grid.innerHTML = projects.map(p => {
        const scope = allScope.filter(s => s.projectId === p.id);
        const completed = scope.filter(s => {
          const acts = s.plannedActivities || [];
          const done = acts.filter(a => a.executionStatus === 'Completed').length;
          return acts.length > 0 && done === acts.length;
        }).length;
        const progress = scope.length > 0 ? Math.round((completed / scope.length) * 100) : 0;
        
        return `
          <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition cursor-pointer" onclick="openProject('${p.id}')">
            <div class="h-2 bg-gradient-to-r from-blue-500 to-purple-500"></div>
            <div class="p-5">
              <h3 class="font-bold text-lg text-gray-900 mb-2">${p.name}</h3>
              <p class="text-sm text-gray-500 mb-4">${p.description || 'Geen omschrijving'}</p>
              
              <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="text-center p-2 bg-slate-50 rounded">
                  <div class="text-2xl font-bold text-blue-600">${scope.length}</div>
                  <div class="text-xs text-gray-500">Werkpakketten</div>
                </div>
                <div class="text-center p-2 bg-slate-50 rounded">
                  <div class="text-2xl font-bold text-emerald-600">${progress}%</div>
                  <div class="text-xs text-gray-500">Gereed</div>
                </div>
              </div>
              
              <div class="h-2 bg-gray-200 rounded-full overflow-hidden mb-3">
                <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600" style="width: ${progress}%"></div>
              </div>
              
              <div class="flex gap-2 text-xs text-gray-400">
                <span>📅 ${new Date(p.startDate || Date.now()).toLocaleDateString('nl-NL')}</span>
                <span>→</span>
                <span>${new Date(p.endDate || Date.now()).toLocaleDateString('nl-NL')}</span>
              </div>
              
              <div class="mt-3 pt-3 border-t flex gap-2">
                <button onclick="event.stopPropagation(); editProject('${p.id}')" class="flex-1 px-3 py-1.5 text-xs bg-blue-50 text-blue-700 rounded hover:bg-blue-100">
                  ✏️ Bewerken
                </button>
                <button onclick="event.stopPropagation(); deleteProject('${p.id}')" class="px-3 py-1.5 text-xs bg-red-50 text-red-700 rounded hover:bg-red-100">
                  🗑️
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function createProject() {
      const name = prompt('Project naam:');
      if (!name) return;
      
      const projects = ChemPrepDB.getProjects();
      const newProject = {
        id: 'proj-' + Date.now(),
        name,
        description: '',
        startDate: new Date().toISOString().split('T')[0],
        endDate: new Date(Date.now() + 90*24*60*60*1000).toISOString().split('T')[0],
        created: new Date().toISOString()
      };
      
      projects.push(newProject);
      ChemPrepDB.saveProjects(projects);
      ChemPrepDB.addChangelogEntry({ action: 'create', type: 'project', description: `Project "${name}" aangemaakt` });
      render();
    }
    
    function openProject(id) {
      ChemPrepDB.setActiveProjectId(id);
      window.location.href = 'dashboard.html';
    }
    
    function editProject(id) {
      const projects = ChemPrepDB.getProjects();
      const project = projects.find(p => p.id === id);
      if (!project) return;
      
      const name = prompt('Project naam:', project.name);
      if (!name) return;
      
      project.name = name;
      ChemPrepDB.saveProjects(projects);
      render();
    }
    
    function deleteProject(id) {
      const projects = ChemPrepDB.getProjects();
      const project = projects.find(p => p.id === id);
      if (!project) return;
      
      if (!confirm(`Project "${project.name}" verwijderen?\n\nALLE werkpakketten worden ook verwijderd!`)) return;
      
      // Remove project
      const updated = projects.filter(p => p.id !== id);
      ChemPrepDB.saveProjects(updated);
      
      // Remove scope items
      const scope = ChemPrepDB.getScopeItems().filter(s => s.projectId !== id);
      ChemPrepDB.saveScopeItems(scope);
      
      ChemPrepDB.addChangelogEntry({ action: 'delete', type: 'project', description: `Project "${project.name}" verwijderd` });
      render();
    }
    
    function exportData() {
      const backup = ChemPrepDB.exportAll();
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chemprep-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const backup = JSON.parse(e.target.result);
            if (!confirm('Huidige data wordt overschreven!\n\nDoorgaan?')) return;
            
            ChemPrepDB.importAll(backup);
            alert('✅ Backup geïmporteerd!');
            render();
          } catch (err) {
            alert('❌ Fout bij importeren: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }
    
    // Initial render
    render();
  </script>
</body>
</html>
